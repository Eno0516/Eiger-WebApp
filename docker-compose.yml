services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-eiger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eiger_pass}
      POSTGRES_DB: ${DB_NAME:-eiger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eiger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${DB_USER:-eiger}:${DB_PASSWORD:-eiger_pass}@postgres:5432/${DB_NAME:-eiger_db}?sslmode=disable
      PORT: 8080
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend-user:
    build:
      context: ./frontend
      dockerfile: apps/user/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: apps/admin/Dockerfile
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  postgres_data:
