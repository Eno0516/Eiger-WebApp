put:
  summary: 参加者ステータス一括更新
  operationId: bulkUpdateParticipants
  tags:
    - events
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: イベントID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [participants]
          properties:
            participants:
              type: array
              items:
                type: object
                required: [user_id, status]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [applied, confirmed, rejected]
  responses:
    "204":
      description: 更新成功
    "400":
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/Error.yaml"
    "401":
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/Error.yaml"
    "403":
      description: 権限エラー（circle_admin のみ）
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/Error.yaml"
