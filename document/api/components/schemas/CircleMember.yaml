type: object
properties:
  circle_id:
    type: string
    format: uuid
    example: "01234567-89ab-cdef-0123-456789abcdef"
  user_id:
    type: string
    format: uuid
    example: "01234567-89ab-cdef-0123-456789abcdef"
  role:
    type: string
    enum: [admin, member, visitor]
    example: "member"
  joined_at:
    type: string
    format: date-time
required:
  - circle_id
  - user_id
  - role
  - joined_at
