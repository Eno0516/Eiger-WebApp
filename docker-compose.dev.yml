services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${DB_USER:-eiger}:${DB_PASSWORD:-eiger_pass}@postgres:5432/${DB_NAME:-eiger_db}?sslmode=disable
      PORT: 8080
      ENV: development
    ports:
      - "8080:8080"

  frontend-user:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/user/node_modules
    command: sh -c "npm install && npm run dev:user"
    ports:
      - "5173:5173"

  frontend-admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    command: sh -c "npm install && npm run dev:admin"
    ports:
      - "5174:5174"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
