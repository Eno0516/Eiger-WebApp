services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${DB_USER:-eiger}:${DB_PASSWORD:-eiger_pass}@postgres:5432/${DB_NAME:-eiger_db}?sslmode=disable
      PORT: 8080
      ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_changeme}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: ${EMAIL_FROM:-noreply@eiger.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend-user:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/user/node_modules
    command: sh -c "npm install && npm run dev:user"
    ports:
      - "5173:5173"

  frontend-admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    command: sh -c "npm install && npm run dev:admin"
    ports:
      - "5174:5174"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (http://localhost:8025)

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
