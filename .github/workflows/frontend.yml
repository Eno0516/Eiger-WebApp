name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (user)
        run: npm run lint --workspace=apps/user

      - name: Lint (admin)
        run: npm run lint --workspace=apps/admin

      - name: Test (user)
        run: npm run test --workspace=apps/user -- --run --coverage

      - name: Test (admin)
        run: npm run test --workspace=apps/admin -- --run --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (user)
        run: npm run build:user

      - name: Build (admin)
        run: npm run build:admin

      - name: Upload user dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-user-dist
          path: frontend/apps/user/dist/

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: frontend/apps/admin/dist/
